<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0b0e24" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Isometric CS Cube Elements -->
  <!-- Top Facet (Data/Math) -->
  <polygon points="24,8 38,16 24,24 10,16" fill="url(#topGrad)" opacity="0.95" />
  
  <!-- Left Facet (Algorithms & Structures) -->
  <polygon points="10,16 24,24 24,40 10,32" fill="url(#leftGrad)" opacity="0.9" />
  
  <!-- Right Facet (Hardware & Architecture) -->
  <polygon points="24,24 38,16 38,32 24,40" fill="url(#rightGrad)" opacity="0.95" />

  <!-- Internal Circuit & Data Grid Lines -->
  <line x1="24" y1="8" x2="24" y2="40" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
  <line x1="10" y1="16" x2="38" y2="32" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.3" />
  <line x1="38" y1="16" x2="10" y2="32" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Central Glowing Node -->
  <circle cx="24" cy="24" r="3" fill="url(#coreGlow)" filter="url(#glow)" />
  <circle cx="24" cy="12" r="1.5" fill="#ffffff" />
  <circle cx="33" cy="21" r="1.5" fill="#38bdf8" />
  <circle cx="15" cy="21" r="1.5" fill="#a5b4fc" />
  <circle cx="24" cy="34" r="1.5" fill="#34d399" />
</svg>
