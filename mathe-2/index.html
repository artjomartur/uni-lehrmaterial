<!DOCTYPE html>
<html lang="de" class="h-full bg-[#0a0c10] text-slate-200">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathematik II | UniSuite</title>
  <meta name="description" content="Interaktives Lehrlabor für Mathematik II (Lineare Algebra).">
  
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .cs-card {
      background: #0f131a;
      border: 1px solid #1e2533;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0a0c10; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e2533; border-radius: 4px; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-[#0a0c10] text-slate-200 antialiased custom-scrollbar selection:bg-rose-600 selection:text-white">

  <!-- Top Technical Header -->
  <div id="app-header"></div>
  <script src="../components.js"></script>
  <script>renderHeader("../");</script>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- Hero Header -->
    <div class="border border-[#1e2533] rounded-xl bg-[#0d1117] p-6 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#1e2533] pb-3 text-xs font-mono text-slate-400">
        <div class="flex items-center gap-2">
          <span class="text-rose-400 font-bold">$</span>
          <span>unisuite-math --module 2 --tu-darmstadt</span>
        </div>
      </div>

      <div class="space-y-1 pt-1">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white font-heading">
          Mathematik II (Lineare Algebra)
        </h1>
        <p class="text-xs sm:text-sm text-slate-300 max-w-4xl leading-relaxed">
          Vektorräume, Matrizen, Eigenwerte, lineare Gleichungssysteme.
        </p>
      </div>
    </div>

    <section class="space-y-6">
      <div class="bg-[#0d1117] border border-[#1e2533] rounded-xl p-5 space-y-5">
        <div class="flex items-center justify-between border-b border-[#1e2533] pb-3">
          <h2 class="text-base font-bold text-white font-heading">Schritt-für-Schritt Gauß-Algorithmus</h2>
          <span class="text-[10px] font-mono text-rose-400 bg-rose-900/30 px-2 py-0.5 rounded border border-rose-500/30">LGS Löser</span>
        </div>
        
        <div class="space-y-4">
          <div>
            <label class="text-xs font-mono text-slate-400 block mb-1">Matrix eingeben (Zeilen per Enter, Spalten per Leerzeichen/Komma):</label>
            <textarea id="input-matrix" rows="4" class="w-full bg-[#0a0c10] border border-[#1e2533] rounded-lg p-3 text-sm font-mono text-white focus:outline-none focus:border-rose-500 transition placeholder-slate-600 custom-scrollbar">2 1 -1 8
-3 -1 2 -11
-2 1 2 -3</textarea>
            <div class="mt-2 flex flex-wrap gap-2">
              <button onclick="solveGauss()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-sm font-mono font-bold transition">
                Gauß-Verfahren starten
              </button>
            </div>
          </div>

          <div id="gauss-error" class="hidden p-3 rounded-lg bg-red-950/30 border border-red-500/30 text-red-400 text-xs font-mono"></div>

          <div id="gauss-steps" class="space-y-4 hidden mt-6">
            <!-- Steps injected here -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
      }
      solveGauss();
    });

    // Fraction arithmetic for exact precision (optional, but floating point is easier for now)
    // We will use floating point but round nicely.
    const EPSILON = 1e-10;

    function formatNumber(num) {
      if (Math.abs(num) < EPSILON) return "0";
      // Convert to fraction heuristically
      for(let i=1; i<=100; i++) {
        let val = num * i;
        if (Math.abs(Math.round(val) - val) < EPSILON) {
          if (i === 1) return Math.round(val).toString();
          return `${Math.round(val)}/${i}`;
        }
      }
      return parseFloat(num.toFixed(4)).toString();
    }

    function formatMatrixLatex(matrix) {
      let latex = "\\begin{pmatrix}\n";
      for (let i = 0; i < matrix.length; i++) {
        latex += matrix[i].map(formatNumber).join(" & ");
        if (i < matrix.length - 1) latex += " \\\\\n";
      }
      latex += "\n\\end{pmatrix}";
      return latex;
    }

    function cloneMatrix(m) {
      return m.map(row => [...row]);
    }

    function solveGauss() {
      const input = document.getElementById("input-matrix").value;
      const errBox = document.getElementById("gauss-error");
      const stepsContainer = document.getElementById("gauss-steps");
      
      errBox.classList.add("hidden");
      stepsContainer.classList.add("hidden");
      stepsContainer.innerHTML = "";

      if (!input.trim()) return;

      try {
        // Parse matrix
        let lines = input.trim().split("\n");
        let matrix = [];
        for (let line of lines) {
          let rowStr = line.trim().split(/[\s,]+/).filter(Boolean);
          if (rowStr.length === 0) continue;
          let row = rowStr.map(s => {
            if (s.includes('/')) {
              let parts = s.split('/');
              return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            return parseFloat(s);
          });
          if (row.some(isNaN)) throw new Error("Ungültige Zahl in der Matrix");
          matrix.push(row);
        }

        if (matrix.length === 0) throw new Error("Leere Matrix");
        let cols = matrix[0].length;
        if (matrix.some(r => r.length !== cols)) throw new Error("Alle Zeilen müssen gleich lang sein.");

        let steps = [];
        let m = cloneMatrix(matrix);
        let rows = m.length;

        steps.push({
          desc: "Ausgangsmatrix",
          matrix: cloneMatrix(m)
        });

        let lead = 0;
        for (let r = 0; r < rows; r++) {
          if (cols <= lead) break;
          
          let i = r;
          while (Math.abs(m[i][lead]) < EPSILON) {
            i++;
            if (rows === i) {
              i = r;
              lead++;
              if (cols === lead) break;
            }
          }
          if (cols === lead) break;

          // Swap rows i and r
          if (i !== r) {
            let temp = m[i];
            m[i] = m[r];
            m[r] = temp;
            steps.push({
              desc: `Vertausche Zeile ${r+1} und Zeile ${i+1} ($R_{${r+1}} \\leftrightarrow R_{${i+1}}$)`,
              matrix: cloneMatrix(m)
            });
          }

          // Normalize row r
          let val = m[r][lead];
          if (Math.abs(val - 1) > EPSILON) {
            for (let j = 0; j < cols; j++) m[r][j] /= val;
            steps.push({
              desc: `Multipliziere Zeile ${r+1} mit $\\frac{1}{${formatNumber(val)}}$ ($R_{${r+1}} \\gets \\frac{1}{${formatNumber(val)}} R_{${r+1}}$)`,
              matrix: cloneMatrix(m)
            });
          }

          // Eliminate other rows
          for (let i = 0; i < rows; i++) {
            if (i === r) continue;
            let factor = m[i][lead];
            if (Math.abs(factor) > EPSILON) {
              for (let j = 0; j < cols; j++) {
                m[i][j] -= factor * m[r][j];
              }
              let factorStr = formatNumber(factor);
              let op = factor > 0 ? "-" : "+";
              let absFactorStr = formatNumber(Math.abs(factor));
              steps.push({
                desc: `Ziehe ${factorStr}-fache der Zeile ${r+1} von Zeile ${i+1} ab ($R_{${i+1}} \\gets R_{${i+1}} ${op} ${absFactorStr} R_{${r+1}}$)`,
                matrix: cloneMatrix(m)
              });
            }
          }
          lead++;
        }

        steps.push({
          desc: "Fertig! (Reduzierte Zeilenstufenform)",
          matrix: cloneMatrix(m)
        });

        // Render steps
        let html = "";
        steps.forEach((step, idx) => {
          html += `
            <div class="p-4 bg-[#0a0c10] border border-[#1e2533] rounded-lg text-sm text-slate-300">
              <div class="font-bold text-rose-400 mb-2 font-mono">Schritt ${idx}:</div>
              <div class="mb-3">${step.desc}</div>
              <div class="overflow-x-auto text-center">
                $$${formatMatrixLatex(step.matrix)}$$
              </div>
            </div>
          `;
        });

        stepsContainer.innerHTML = html;
        stepsContainer.classList.remove("hidden");

        if (window.renderMathInElement) {
          renderMathInElement(stepsContainer, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
        }

      } catch (e) {
        errBox.innerText = "Fehler: " + e.message;
        errBox.classList.remove("hidden");
      }
    }
  </script>

  <div id="app-footer"></div>
  <script>renderFooter("../");</script>
</body>
</html>
