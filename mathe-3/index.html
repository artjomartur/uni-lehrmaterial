<!DOCTYPE html>
<html lang="de" class="h-full bg-[#0a0c10] text-slate-200">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe 1, 2, 3 &amp; ProMi | UniSuite</title>
  <meta name="description" content="Interaktives Lehrlabor für Mathematik (ProMi, Analysis, Lineare Algebra, Stochastik).">
  
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .cs-card {
      background: #0f131a;
      border: 1px solid #1e2533;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0a0c10; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e2533; border-radius: 4px; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-[#0a0c10] text-slate-200 antialiased custom-scrollbar selection:bg-rose-600 selection:text-white">

  <!-- Top Technical Header -->
  <div id="app-header"></div>
  <script src="../components.js"></script>
  <script>renderHeader("../");</script>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- Hero Header -->
    <div class="border border-[#1e2533] rounded-xl bg-[#0d1117] p-6 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#1e2533] pb-3 text-xs font-mono text-slate-400">
        <div class="flex items-center gap-2">
          <span class="text-rose-400 font-bold">$</span>
          <span>unisuite-math --module 3 --tu-darmstadt</span>
        </div>
      </div>

      <div class="space-y-1 pt-1">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white font-heading">
          Mathematik III &amp; ProMi (Stochastik / Propädeutikum)
        </h1>
        <p class="text-xs sm:text-sm text-slate-300 max-w-4xl leading-relaxed">
          Wahrscheinlichkeit, Statistik, sowie Grundlagen der Logik, Mengenlehre und Induktion.
        </p>
      </div>
    </div>

    <!-- SECTIONS -->
    <section class="space-y-6">
      <div class="bg-[#0d1117] border border-[#1e2533] rounded-xl p-5 space-y-5">
        <h2 class="text-base font-bold text-white font-heading">Bayes-Theorem Rechner (z.B. Medizin-Test)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
          <div>
            <label class="block text-slate-400 mb-1" title="P(A)">Prävalenz / P(A)</label>
            <input type="number" id="input-p-a" step="0.001" min="0" max="1" value="0.01" class="w-full bg-[#0a0c10] border border-[#1e2533] rounded px-3 py-2 text-white focus:outline-none focus:border-rose-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1" title="P(B|A)">Sensitivität / P(B|A)</label>
            <input type="number" id="input-p-b-a" step="0.001" min="0" max="1" value="0.95" class="w-full bg-[#0a0c10] border border-[#1e2533] rounded px-3 py-2 text-white focus:outline-none focus:border-rose-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1" title="P(B|¬A)">Falsch-Positiv-Rate / P(B|¬A)</label>
            <input type="number" id="input-p-b-nota" step="0.001" min="0" max="1" value="0.05" class="w-full bg-[#0a0c10] border border-[#1e2533] rounded px-3 py-2 text-white focus:outline-none focus:border-rose-500">
          </div>
        </div>

        <button id="btn-calculate" class="bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-4 rounded text-sm transition-colors">
          Berechnen
        </button>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
          <div class="p-4 bg-[#0a0c10] border border-[#1e2533] rounded-lg">
            <h3 class="text-sm font-bold text-white mb-4">Wahrscheinlichkeitsbaum</h3>
            <div id="tree-container" class="flex justify-center overflow-x-auto text-white"></div>
          </div>
          <div class="p-4 bg-[#0a0c10] border border-[#1e2533] rounded-lg">
            <h3 class="text-sm font-bold text-white mb-4">Rechenweg (Satz von Bayes)</h3>
            <div id="math-container" class="text-slate-300 text-sm overflow-x-auto"></div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <div id="app-footer"></div>
  <script>renderFooter("../");</script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
      }
    });
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    function updateCalculator() {
      const pA = parseFloat(document.getElementById('input-p-a').value) || 0;
      const pBA = parseFloat(document.getElementById('input-p-b-a').value) || 0;
      const pBNotA = parseFloat(document.getElementById('input-p-b-nota').value) || 0;

      const pNotA = 1 - pA;
      const pNotBA = 1 - pBA;
      const pNotBNotA = 1 - pBNotA;

      const pB = (pBA * pA) + (pBNotA * pNotA);
      let pAB = 0;
      if (pB > 0) {
        pAB = (pBA * pA) / pB;
      }

      // Update KaTeX Math
      const mathHTML = `
        <div class="space-y-4">
          <p>Gesucht ist $P(A|B)$, die Wahrscheinlichkeit für A, unter der Bedingung B (z.B. Kranksein bei positivem Test).</p>
          <p>$$P(A|B) = \\frac{P(B|A) \\cdot P(A)}{P(B)}$$</p>
          <p>$$P(B) = P(B|A) \\cdot P(A) + P(B|\\neg A) \\cdot P(\\neg A)$$</p>
          <hr class="border-[#1e2533] my-2">
          <p>Werte einsetzen:</p>
          <p>$$P(B) = ${pBA} \\cdot ${pA} + ${pBNotA} \\cdot ${pNotA.toFixed(4)} = ${pB.toFixed(4)}$$</p>
          <p>$$P(A|B) = \\frac{${pBA} \\cdot ${pA}}{${pB.toFixed(4)}} = \\frac{${(pBA * pA).toFixed(4)}}{${pB.toFixed(4)}} \\approx ${(pAB * 100).toFixed(2)}\\%$$</p>
        </div>
      `;
      const mathContainer = document.getElementById('math-container');
      mathContainer.innerHTML = mathHTML;
      if (window.renderMathInElement) {
        renderMathInElement(mathContainer, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
      }

      // Update Mermaid
      const graphDef = `
      graph LR
        Start(( )) -->|P(A)=${pA}| A(A)
        Start -->|P(¬A)=${pNotA.toFixed(4)}| NotA(¬A)
        A -->|P(B|A)=${pBA}| B1(B)
        A -->|P(¬B|A)=${pNotBA.toFixed(4)}| NotB1(¬B)
        NotA -->|P(B|¬A)=${pBNotA}| B2(B)
        NotA -->|P(¬B|¬A)=${pNotBNotA.toFixed(4)}| NotB2(¬B)
        
        B1 -.-> |${(pBA*pA).toFixed(4)}| R1[P(A ∩ B)]
        NotB1 -.-> |${(pNotBA*pA).toFixed(4)}| R2[P(A ∩ ¬B)]
        B2 -.-> |${(pBNotA*pNotA).toFixed(4)}| R3[P(¬A ∩ B)]
        NotB2 -.-> |${(pNotBNotA*pNotA).toFixed(4)}| R4[P(¬A ∩ ¬B)]
      `;
      
      const treeContainer = document.getElementById('tree-container');
      treeContainer.innerHTML = '<div class="mermaid">' + graphDef + '</div>';
      mermaid.run({ nodes: treeContainer.querySelectorAll('.mermaid') }).catch(e => console.error(e));
    }

    document.getElementById('btn-calculate').addEventListener('click', updateCalculator);
    
    // Initial render
    setTimeout(updateCalculator, 200); 
  </script>
</body>
</html>
